name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: integration + end-to-end (Postgres, HAPI FHIR, Keycloak, SMART)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres, HAPI FHIR, Keycloak and the SMART launcher
        run: docker compose -f deploy/compose.yaml --profile keycloak --profile smart up -d --wait
      - name: Load synthetic fixtures
        run: pnpm fixtures:load
      - run: pnpm test:integration
      - name: Install Chromium for Playwright
        run: pnpm --filter @aipass/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml --profile keycloak --profile smart logs --tail=200
