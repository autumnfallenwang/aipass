name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (everything that ships)
        run: pnpm audit --prod

  integration:
    name: integration + end-to-end (Postgres, HAPI FHIR, Keycloak, SMART)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres, HAPI FHIR, Keycloak and the SMART launcher
        run: docker compose -f deploy/compose.yaml --profile keycloak --profile smart up -d --wait
      - name: Load synthetic fixtures
        run: pnpm fixtures:load
      - run: pnpm test:integration
      - name: Install Chromium for Playwright
        run: pnpm --filter @aipass/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml --profile keycloak --profile smart logs --tail=200

  stack:
    name: docker compose up (the whole stack, from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build and start every service
        run: docker compose up -d --build --wait
      - name: The health check, through the public origin, grades A
        run: node scripts/stack-check.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

  helm:
    name: Helm chart (lint + strict schema check; nothing is deployed, D12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: >-
          helm lint deploy/helm/aipass
          --set secrets.databaseUrl=postgres://x
          --set secrets.betterAuthSecret=lint-only-secret-xxxxxxxxxxxxxxxxxx
          --set secrets.vaultKey=lint-only-vault-key-yyyyyyyyyyyyyyyyyy
      - name: Render and validate every resource
        run: |
          helm template aipass deploy/helm/aipass --set secrets.existingSecret=aipass --set ingress.enabled=true --set demo=true \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -

