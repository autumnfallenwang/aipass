name: release

# Signed releases (S7). Runs by hand only for now (D12): we develop and test
# on localhost and spend no time on deployment yet. When run:
# - the api, gateway and web images go to GHCR, with an SBOM and SLSA
#   provenance from BuildKit, and a GitHub artifact attestation (Sigstore);
# - for a release, a source tarball with its own attestation is attached.
# Verify with:  gh attestation verify oci://ghcr.io/autumnfallenwang/aipass-api:<version> --owner autumnfallenwang
#               gh attestation verify aipass-<version>.tar.gz --owner autumnfallenwang
on:
  # Was also `release: [published]`; switched off until deployment is in scope.
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (no GitHub release is touched)
        default: edge

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    name: image (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, gateway, web]
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aipass-${{ matrix.target }}:${{ steps.v.outputs.version }}
            ${{ github.event_name == 'release' && !github.event.release.prerelease && format('ghcr.io/{0}/aipass-{1}:latest', github.repository_owner, matrix.target) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/aipass-${{ matrix.target }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  source:
    name: source tarball
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Archive
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v="${TAG#v}"
          git archive --format=tar.gz --prefix="aipass-$v/" -o "aipass-$v.tar.gz" "$TAG"
          sha256sum "aipass-$v.tar.gz" > "aipass-$v.tar.gz.sha256"
          echo "FILE=aipass-$v.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.FILE }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber
