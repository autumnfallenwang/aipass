# The whole of aipass on one machine, built from source (S7):
#
#   docker compose up
#
# then open http://localhost:3000 (the first account you create is the admin).
# Agents connect to http://localhost:3002/agents/<agent-id>/mcp.
#
# AIPASS_DEMO=1 (the default here) loads synthetic patients and the Maria demo.
# The secrets below are public local-trial values: aipass refuses them unless
# PUBLIC_URL is localhost. Anywhere else, set your own (32+ characters) in .env.
# This file is for trying aipass; the project itself deploys nothing (D12).
name: aipass-stack

x-aipass-env: &aipass-env
  DATABASE_URL: postgres://aipass:aipass@postgres:5432/aipass
  FHIR_BASE_URL: http://hapi:8080/fhir
  API_URL: http://api:3001
  GATEWAY_URL: ${AIPASS_GATEWAY_URL:-http://localhost:3002}
  GATEWAY_INTERNAL_URL: http://gateway:3002
  PUBLIC_URL: ${AIPASS_PUBLIC_URL:-http://localhost:3000}
  WEB_URL: ${AIPASS_PUBLIC_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-aipass-local-trial-auth-secret-localhost-only}
  AIPASS_VAULT_KEY: ${AIPASS_VAULT_KEY:-aipass-local-trial-vault-key-localhost-only}
  AIPASS_VAULT_KEY_PREVIOUS: ${AIPASS_VAULT_KEY_PREVIOUS:-}
  ORG_NAME: ${ORG_NAME:-Sunrise Clinic}
  # Behind your own proxy: its addresses, so rate limits see real clients.
  AIPASS_TRUSTED_PROXIES: ${AIPASS_TRUSTED_PROXIES:-}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: aipass
      POSTGRES_PASSWORD: aipass
      POSTGRES_DB: aipass
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipass -d aipass"]
      interval: 2s
      timeout: 3s
      retries: 30

  hapi:
    image: hapiproject/hapi:v8.12.0-2
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.client_id_strategy: ANY
      hapi.fhir.enforce_referential_integrity_on_write: "false"
      hapi.fhir.enforce_referential_integrity_on_delete: "false"
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.default_page_size: 20
      hapi.fhir.max_page_size: 100
      hapi.fhir.reuse_cached_search_results_millis: 0

  # Migrates the database, and with AIPASS_DEMO=1 loads the synthetic demo. Then exits.
  init:
    image: aipass-api:local
    build: { context: ., target: api }
    command: ["node", "--enable-source-maps", "dist/init.mjs"]
    environment:
      <<: *aipass-env
      AIPASS_DEMO: ${AIPASS_DEMO:-1}
    depends_on:
      postgres: { condition: service_healthy }
      hapi: { condition: service_started }
    restart: "no"

  api:
    image: aipass-api:local
    build: { context: ., target: api }
    environment: *aipass-env
    depends_on:
      init: { condition: service_completed_successfully }

  gateway:
    image: aipass-gateway:local
    build: { context: ., target: gateway }
    environment: *aipass-env
    ports:
      - "127.0.0.1:${AIPASS_GATEWAY_PORT:-3002}:3002"
    depends_on:
      init: { condition: service_completed_successfully }

  web:
    image: aipass-web:local
    build: { context: ., target: web }
    ports:
      - "127.0.0.1:${AIPASS_WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
