{{- if .Values.ingress.enabled }}
{{- $web := urlParse .Values.publicUrl }}
{{- $gw := urlParse .Values.gatewayUrl }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "aipass.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ $web.hostname | quote }}, {{ $gw.hostname | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    # People's browsers: one origin (D10). /api and the OAuth discovery
    # documents go straight to the api, so it sees the ingress's
    # X-Forwarded-For (rate limits); everything else is the web app.
    - host: {{ $web.hostname | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 3001 } }
          - path: /.well-known/oauth-authorization-server/api/auth
            pathType: Exact
            backend:
              service: { name: api, port: { number: 3001 } }
          - path: /.well-known/openid-configuration/api/auth
            pathType: Exact
            backend:
              service: { name: api, port: { number: 3001 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 3000 } }
    # AI clients: only the gateway.
    - host: {{ $gw.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 3002 } }
{{- end }}
