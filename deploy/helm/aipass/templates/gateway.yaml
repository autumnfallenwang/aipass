apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "aipass.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.replicas.gateway }}
  selector:
    matchLabels:
      {{- include "aipass.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aipass.selector" (dict "root" . "component" "gateway") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "aipass.podSecurity" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "aipass.image" (dict "root" . "name" "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3002
          env:
            {{- include "aipass.env" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          securityContext:
            {{- include "aipass.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "aipass.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aipass.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 3002
      targetPort: http
