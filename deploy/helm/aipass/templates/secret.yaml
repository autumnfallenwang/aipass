{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "aipass.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl (or secrets.existingSecret) is required" $s.databaseUrl | quote }}
  BETTER_AUTH_SECRET: {{ required "secrets.betterAuthSecret (32+ characters) is required" $s.betterAuthSecret | quote }}
  AIPASS_VAULT_KEY: {{ required "secrets.vaultKey (32+ characters) is required" $s.vaultKey | quote }}
  {{- with $s.vaultKeyPrevious }}
  AIPASS_VAULT_KEY_PREVIOUS: {{ . | quote }}
  {{- end }}
  {{- with $s.fhirAuthorization }}
  FHIR_AUTHORIZATION: {{ . | quote }}
  {{- end }}
{{- end }}
