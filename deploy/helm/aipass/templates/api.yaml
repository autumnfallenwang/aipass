apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "aipass.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      {{- include "aipass.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aipass.selector" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "aipass.podSecurity" . | nindent 8 }}
      initContainers:
        # Migrations (and, with demo: true, the synthetic demo). Idempotent.
        - name: init
          image: {{ include "aipass.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "--enable-source-maps", "dist/init.mjs"]
          env:
            {{- include "aipass.env" . | nindent 12 }}
            - name: AIPASS_DEMO
              value: {{ ternary "1" "0" .Values.demo | quote }}
          securityContext:
            {{- include "aipass.containerSecurity" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "aipass.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            {{- include "aipass.env" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            {{- include "aipass.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # Fixed name: the web image passes /api/* to http://api:3001.
  name: api
  labels:
    {{- include "aipass.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aipass.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 3001
      targetPort: http
